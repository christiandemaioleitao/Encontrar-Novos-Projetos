name: Scanner de Alvarás — Goiânia

on:
  schedule:
    # 12:00 UTC = 09:00 (horário de Brasília) — 1x por dia
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      TELEGRAM_BOT_TOKEN:
        description: "Token do Bot Telegram (deixe vazio p/ usar o secret)"
        required: false
        type: string
      TELEGRAM_CHAT_ID:
        description: "Chat ID do Telegram (deixe vazio p/ usar o secret)"
        required: false
        type: string
      TELEGRAM_THREAD_ID:
        description: "Thread ID (opcional)"
        required: false
        type: string

# Necessário para o passo "Salvar estado no repo" conseguir dar git push
permissions:
  contents: write

jobs:
  scan:
    name: 🔍 Varredura de Alvarás
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: python3 -m pip install --quiet requests

      - name: Restaurar estado
        run: |
          if [ -f scripts/last_valid_id.json ]; then
            echo "✅ Estado: $(cat scripts/last_valid_id.json)"
          else
            echo '{ "last_valid_id": 49125 }' > scripts/last_valid_id.json
            echo "📄 Estado inicial criado"
          fi

      - name: Executar scanner
        run: python3 scripts/alvara_scanner.py
        env:
          # Em execução manual usa o input; se vazio (ou em agendamento) usa o secret.
          TELEGRAM_BOT_TOKEN: ${{ github.event.inputs.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ github.event.inputs.TELEGRAM_CHAT_ID   || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ github.event.inputs.TELEGRAM_THREAD_ID || secrets.TELEGRAM_THREAD_ID }}

      - name: Salvar estado no repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_valid_id.json scripts/scan_log.json 2>/dev/null || true
          git diff --cached --quiet && echo "Sem mudanças" || {
            git commit -m "[auto] scanner $(date +'%Y-%m-%d %H:%M')" || true
            git push origin main || echo "Push não realizado"
          }
