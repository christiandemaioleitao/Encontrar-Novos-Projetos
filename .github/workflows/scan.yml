name: Scanner de Alvarás — Goiânia

on:
  schedule:
    # Executa todo dia às 09:00 Brasília = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  scan:
    name: 🔍 Varredura de Alvarás
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: python3 -m pip install --quiet requests

      - name: Restaurar estado
        run: |
          if [ -f scripts/last_valid_id.json ]; then
            echo "✅ Estado: $(cat scripts/last_valid_id.json)"
          else
            echo '{ "last_valid_id": 50590, "consecutive_empty": 0 }' > scripts/last_valid_id.json
            echo "📄 Estado inicial criado"
          fi

      - name: Executar scanner
        run: python3 scripts/alvara_scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}

      - name: Salvar estado no repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_valid_id.json scripts/scan_log.json 2>/dev/null || true
          git diff --cached --quiet && echo "Sem mudancas" || {
            git commit -m "[auto] scanner $(date +'%Y-%m-%d %H:%M')" || true
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin main || echo "Push nao realizado"
          }