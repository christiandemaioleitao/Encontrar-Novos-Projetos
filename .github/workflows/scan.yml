name: Scanner de Alvarás — Goiânia

on:
  schedule:
    # Executa todo dia às 12:00 UTC (= 09:00 Brasília)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      start_id:
        description: "ID inicial para testar (sobrescreve o estado salvo)"
        required: false
        default: ""

jobs:
  scan:
    name: 🔍 Varredura de Alvarás
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Restaurar estado anterior
        run: |
          if [ -f scripts/last_valid_id.json ]; then
            echo "Estado anterior encontrado"
            cat scripts/last_valid_id.json
          else
            echo '{ "last_valid_id": 49125, "consecutive_empty": 0 }' > scripts/last_valid_id.json
          fi

      - name: Sobrescrever start_id se fornecido manualmente
        if: github.event.inputs.start_id != ''
        run: |
          START_ID="${{ github.event.inputs.start_id }}"
          python -c "
          import json
          with open('scripts/last_valid_id.json') as f:
              state = json.load(f)
          state['last_valid_id'] = int('${{ github.event.inputs.start_id }}')
          state['consecutive_empty'] = 0
          with open('scripts/last_valid_id.json', 'w') as f:
              json.dump(state, f, indent=2)
          print(f'Start ID forçado para: {state[\"last_valid_id\"]}')
          "

      - name: Executar scanner
        run: python scripts/alvara_scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}

      - name: Commitar estado atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/last_valid_id.json scripts/scan_log.json 2>/dev/null || true
          git commit -m "[auto] atualiza scanner $(date +'%Y-%m-%d')" 2>/dev/null || echo "Nada para commitar"
          git push origin main 2>/dev/null || echo "Push não realizado"