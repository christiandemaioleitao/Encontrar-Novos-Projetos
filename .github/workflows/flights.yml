name: Scanner de Voos — GYN/BSB → RIO

on:
  schedule:
    # Todo dia às 03:00 Brasília = 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      TELEGRAM_BOT_TOKEN:
        description: "Token do Bot Telegram"
        required: true
        type: string
      TELEGRAM_CHAT_ID:
        description: "Chat ID do Telegram"
        required: true
        type: string
      TELEGRAM_THREAD_ID:
        description: "Thread ID (opicional)"
        required: false
        type: string

jobs:
  flights:
    name: ✈️ Passagens GYN/BSB → RIO
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: python3 -m pip install --quiet requests

      - name: Executar scanner
        run: python3 scripts/flights_scanner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ inputs.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ inputs.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ inputs.TELEGRAM_THREAD_ID }}